StylesPath = .github/styles
MinAlertLevel = suggestion

Vocab = docs
MinAlertLevel = suggestion

[*]
BasedOnStyles = Vale

[*.md]
# Exclude `{{< ... >}}`, `{{% ... %}}`, [Who]({{< ... >}})
TokenIgnores = ({{[%<] .* [%>]}}.*?{{[%<] ?/.* [%>]}}), \
(\[.+\]\({{< .+ >}}[^)]*\)), \
({{[%<] .+ [%>]}}), \
(https?://[^\s"'`)>]+), \
(src="[^"]*"), \
(#[\w-]+\))

# Exclude `{{<  myshortcode `This is some <b>HTML</b>, ... >}}`
BlockIgnores = (?sm)^({{[%<] [^{]*?\s[%>]}})\n$, \
(?s) *({{< highlight [^>]* ?>}}.*?{{< ?/ ?highlight >}}), \
({{[%<] .+ [%>]}})

# Archived version snapshots are kept as published; do not lint them.
[{content/versions/**,**/content/versions/**}]
BasedOnStyles =
